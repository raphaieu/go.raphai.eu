services:
  redirect:
    build: .
    container_name: go-raphai-redirect
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS}
      - DB_PATH=/data/redirects.db
    volumes:
      - redirect_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/admin/login"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redirect_data:
